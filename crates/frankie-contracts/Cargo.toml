[package]
name = "frankie-contracts"
version = "0.1.0"
edition = "2021"
publish = false
description = "Shared Frankie contracts: error vocabulary, result envelope, tool descriptor, operating modes, presentation state."

# Deliberately tiny: no tokio, no reqwest, no uniffi. Every other crate may depend on this one.
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
